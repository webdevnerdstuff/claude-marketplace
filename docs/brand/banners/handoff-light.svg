<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
	<title id="title">handoff</title>
	<desc id="desc">The handoff icon, a summary card passed along by an arrow, beside the word handoff: pick up where any session left off.</desc>
	<rect width="1200" height="300" rx="24" fill="#ffffff"/>

	<!-- The mark: the plugin's icon. -->
	<g transform="translate(100 42) scale(0.421875)">
		<rect width="512" height="512" rx="112" fill="#0b0b0f"/>
		<rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#2a2a35" stroke-width="6"/>

		<!-- The handoff note: a summary card with its title and lines. -->
		<rect x="96" y="112" width="236" height="288" rx="28" fill="#000000" stroke="#2a2a35" stroke-width="8"/>
		<rect x="128" y="148" width="132" height="22" rx="11" fill="#2492ff"/>
		<rect x="128" y="200" width="172" height="14" rx="7" fill="#2a2a35"/>
		<rect x="128" y="232" width="148" height="14" rx="7" fill="#2a2a35"/>
		<rect x="128" y="264" width="160" height="14" rx="7" fill="#2a2a35"/>
		<rect x="128" y="312" width="22" height="22" rx="6" fill="#0aff04"/>
		<rect x="164" y="316" width="108" height="14" rx="7" fill="#2a2a35"/>
		<rect x="128" y="350" width="22" height="22" rx="6" fill="#ffb46a"/>
		<rect x="164" y="354" width="92" height="14" rx="7" fill="#2a2a35"/>

		<!-- Passed along to the next session. -->
		<path d="M 300 256 L 410 256 M 368 210 L 414 256 L 368 302" stroke="#ff1190" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
	</g>

	<!-- Wordmark -->
	<text x="388" y="162" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="88" font-weight="700" letter-spacing="-2">
		<tspan fill="#16161d">hand</tspan><tspan fill="#2492ff">off</tspan><tspan fill="#ff1190">.</tspan>
	</text>
	<text x="392" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="30" fill="#5c5c66">
		Pick up where any session left off
	</text>
</svg>
