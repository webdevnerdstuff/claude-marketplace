<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
	<title id="title">gac</title>
	<desc id="desc">The gac icon, a feature branch merging back into main, beside the word gacppmr: commit to release in one command.</desc>
	<rect width="1200" height="300" rx="24" fill="#ffffff"/>

	<!-- The mark: the plugin's icon. -->
	<g transform="translate(100 42) scale(0.421875)">
		<rect width="512" height="512" rx="112" fill="#0b0b0f"/>
		<rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#2a2a35" stroke-width="6"/>

		<!-- A feature branch leaving main and merging back in. -->
		<path d="M 196 386 L 196 126" stroke="#2492ff" stroke-width="22" stroke-linecap="round" fill="none"/>
		<path d="M 196 336 C 196 296, 316 300, 316 256 L 316 226 C 316 186, 196 196, 196 156" stroke="#ff1190" stroke-width="22" stroke-linecap="round" fill="none"/>

		<!-- Commits. -->
		<circle cx="196" cy="386" r="30" fill="#0b0b0f" stroke="#2492ff" stroke-width="18"/>
		<circle cx="316" cy="256" r="30" fill="#0b0b0f" stroke="#ff1190" stroke-width="18"/>
		<!-- The merge commit, done. -->
		<circle cx="196" cy="126" r="40" fill="#0aff04"/>
		<path d="M 178 127 L 191 140 L 216 113" stroke="#0b0b0f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
	</g>

	<!-- Wordmark -->
	<text x="388" y="162" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="88" font-weight="700" letter-spacing="-2">
		<tspan fill="#16161d">gac</tspan><tspan fill="#2492ff">ppmr</tspan><tspan fill="#ff1190">.</tspan>
	</text>
	<text x="392" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="30" fill="#5c5c66">
		From commit to release in one command
	</text>
</svg>
