<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
	<title id="title">marketplace</title>
	<desc id="desc">A shelf of four plugin tiles, three mods and one skill, beside the word marketplace: WebDevNerdStuff's Claude Code mods and skills.</desc>
	<rect width="1200" height="300" rx="24" fill="#0b0b0f"/>

	<!-- The mark: a shelf of plugin tiles. -->
	<g transform="translate(84 42)">
		<rect x="0" y="0" width="248" height="216" rx="18" fill="#000000" stroke="#2a2a35" stroke-width="3"/>
		<line x1="0" y1="40" x2="248" y2="40" stroke="#2a2a35" stroke-width="3"/>
		<!-- Header: the marketplace name and an add button. -->
		<rect x="16" y="15" width="96" height="10" rx="5" fill="#2a2a35"/>
		<rect x="206" y="12" width="26" height="16" rx="8" fill="#ff1190"/>
		<rect x="214" y="19" width="10" height="2.5" rx="1.25" fill="#ffffff"/>
		<rect x="217.75" y="15.25" width="2.5" height="10" rx="1.25" fill="#ffffff"/>
		<!-- Mod tiles: a pane, a highlighted block, a moved row. -->
		<g>
			<rect x="16" y="54" width="102" height="70" rx="12" fill="none" stroke="#2a2a35" stroke-width="2.5"/>
			<circle cx="34" cy="72" r="6" fill="#2492ff"/>
			<rect x="28" y="88" width="62" height="8" rx="4" fill="#2a2a35"/>
			<rect x="28" y="102" width="42" height="8" rx="4" fill="#2a2a35"/>
		</g>
		<g>
			<rect x="130" y="54" width="102" height="70" rx="12" fill="none" stroke="#2a2a35" stroke-width="2.5"/>
			<circle cx="148" cy="72" r="6" fill="#0aff04"/>
			<rect x="142" y="88" width="24" height="8" rx="4" fill="#df00df"/>
			<rect x="170" y="88" width="36" height="8" rx="4" fill="#fef611"/>
			<rect x="142" y="102" width="50" height="8" rx="4" fill="#ff6106"/>
		</g>
		<g>
			<rect x="16" y="134" width="102" height="70" rx="12" fill="none" stroke="#2a2a35" stroke-width="2.5"/>
			<circle cx="34" cy="152" r="6" fill="#a5a8ff"/>
			<rect x="28" y="168" width="56" height="8" rx="4" fill="#2a2a35"/>
			<path d="M 92 172 L 104 172 M 99 167 L 104 172 L 99 177" stroke="#a5a8ff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
			<rect x="28" y="182" width="38" height="8" rx="4" fill="#2a2a35"/>
		</g>
		<!-- Skill tile: a page of instructions, picked. -->
		<g>
			<rect x="130" y="134" width="102" height="70" rx="12" fill="#ff119026" stroke="#ff1190" stroke-width="2.5"/>
			<circle cx="148" cy="152" r="6" fill="#ffb46a"/>
			<rect x="142" y="168" width="64" height="6" rx="3" fill="#ff1190"/>
			<rect x="142" y="179" width="52" height="6" rx="3" fill="#ff1190" fill-opacity="0.6"/>
			<rect x="142" y="190" width="40" height="6" rx="3" fill="#ff1190" fill-opacity="0.35"/>
		</g>
	</g>

	<!-- Wordmark -->
	<text x="388" y="162" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="88" font-weight="700" letter-spacing="-2">
		<tspan fill="#ffffff">market</tspan><tspan fill="#2492ff">place</tspan><tspan fill="#ff1190">.</tspan>
	</text>
	<text x="392" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="30" fill="#9a9aa6">
		WebDevNerdStuff's Claude Code mods and skills
	</text>
</svg>
